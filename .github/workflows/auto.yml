name: 每天自动运行钱币采集

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0点（北京时间早 8:00）运行
  workflow_dispatch: # 允许你随时在后台手动点击按钮运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码的权限
    steps:
      - name: 签出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行采集脚本
        run: python collector.py

      - name: 自动提交并推送到 GitHub 仓库
        run: |
          git config --global user.name "CoinBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "自动更新今日钱币内容: $(date)" || exit 0
          git push
